<!doctype html><html lang="cs"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#10151c"><link rel="manifest" href="manifest.webmanifest"><title>RideFlow</title><style>*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system;background:#10151c;color:white}header{height:42vh;padding:24px;background:linear-gradient(145deg,#314a5f,#111820);display:flex;align-items:center;justify-content:center}h1{position:absolute;top:20px;left:20px}b{color:#25c878}.bike{font-size:64px}.panel{margin-top:-22px;background:#171e27;border-radius:25px 25px 0 0;padding:22px;min-height:60vh}.row{display:flex;gap:8px;overflow:auto;margin:10px 0 18px}button{border:1px solid #3a4856;background:#202a35;color:white;padding:12px 15px;border-radius:14px;font-size:15px}.on{background:#176a4c;border-color:#25c878}input{width:100%;padding:15px;border:0;border-radius:14px;background:#222c37;color:white;font-size:16px}.go{width:100%;margin-top:14px;background:#25c878;color:#07150f;font-weight:800}.status{margin-top:14px;padding:12px;background:#202a35;border-radius:14px;color:#c4ced7}small{color:#9aa7b5}</style></head><body><header><h1>Ride<b>Flow</b></h1><div class="bike">🏍️</div></header><main class="panel"><small>Typ motorky</small><div class="row group"><button class="on">Road</button><button>Enduro</button><button>Chopper</button></div><small>Styl trasy</small><div class="row group"><button>Fast</button><button class="on">Curvy</button><button>Scenic</button><button>Adventure</button></div><input id="dest" placeholder="Kam chceš jet?"><button class="go" id="go">Navrhnout trasu</button><div class="status" id="s">GPS připravena.</div></main><script>document.querySelectorAll(".group").forEach(g=>g.querySelectorAll("button").forEach(b=>b.onclick=()=>{g.querySelectorAll("button").forEach(x=>x.classList.remove("on"));b.classList.add("on")}));go.onclick=()=>{s.textContent="Zjišťuji polohu…";navigator.geolocation?navigator.geolocation.getCurrentPosition(p=>s.textContent="Poloha nalezena. Další krok: skutečný výpočet trasy.",e=>s.textContent="Povol RideFlow přístup k poloze."):s.textContent="GPS není dostupná."};if("serviceWorker"in navigator)navigator.serviceWorker.register("sw.js");</script></body></html>
